[project]
name = "calculator"
version = "0.1.0"
description = "A simple calculator module with basic arithmetic operations"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Itzik Ezra" }
]
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
